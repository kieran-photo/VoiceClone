<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceClone & Vocaloid Studio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #1e113a, #030712 75%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 540px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 28px;
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(168, 85, 247, 0.15);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.3);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .pulse-dot {
      width: 7px;
      border-radius: 50%;
      background: #06b6d4;
      box-shadow: 0 0 10px #06b6d4;
      animation: pulse 1.6s infinite;
    }

    h1 {
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 40%, #a855f7 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 36px;
    }

    .cyber-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 36px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.45);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .cyber-btn:hover {
      box-shadow: 0 0 45px rgba(6, 182, 212, 0.7);
    }

    .btn-inner {
      position: absolute;
      inset: 2px;
      background: #090d16;
      border-radius: 14px;
      transition: background 0.3s ease;
      z-index: 1;
    }

    .cyber-btn:hover .btn-inner {
      background: rgba(9, 13, 22, 0.3);
    }

    .btn-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">
      <span class="pulse-dot"></span>
      Neural Audio Engine Online
    </div>

    <h1>VoiceClone Studio</h1>
    <p>Transform any lyrics into vocaloid singing and cloned vocals across every electronic genre and subgenre.</p>

    <a 
      href="https://www.flowmusic.app/space/1eb1e66e-c3d8-4a1c-a807-debde8a3c9a2" 
      target="_blank" 
      rel="noopener noreferrer" 
      class="cyber-btn"
    >
      <div class="btn-inner"></div>
      <div class="btn-content">
        <span>Launch Studio</span>
        <span style="color: #38bdf8; font-size: 16px;">→</span>
      </div>
    </a>
  </div>
</body>
</html>
